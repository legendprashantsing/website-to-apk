name: Build Custom APK

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Build Script
        run: |
          chmod +x ./make.sh
          
          # Force the script's internal variables to match right before the compiler triggers
          sed -i 's|./gradlew|export ANDROID_HOME="$ANDROID_SDK_ROOT" && ./gradlew|g' make.sh
          
          # Pre-configure the required signing keys securely
          mkdir -p app
          keytool -genkeypair -v -keystore app/my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias webtoapk -storepass 123456 -keypass 123456 -dname "CN=WebToApk" || true
          keytool -genkeypair -v -keystore app/release.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias android -storepass android -keypass android -dname "CN=WebToApk" || true
          
          # Run the builder cleanly
          echo "y" | ./make.sh build webapk.conf

      - name: Extract Completed APK
        uses: actions/upload-artifact@v4
        with:
          name: Twitter-AdFree
          path: "**/*.apk"
          
