name: Build Custom APK

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Build Script
        run: |
          chmod +x ./make.sh
          
          # 1. Pre-configure the signing key using the exact alias "my" required by the compiler
          mkdir -p app
          keytool -genkeypair -v -keystore app/my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my -storepass 123456 -keypass 123456 -dname "CN=WebToApk" || true
          keytool -genkeypair -v -keystore app/release.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias android -storepass android -keypass android -dname "CN=WebToApk" || true
          
          # 2. Let the script prepare your app configurations completely
          for i in {1..30}; do echo "y"; done | ./make.sh build webapk.conf || true
          
          # 3. Explicitly unify the environment variables
          export ANDROID_HOME="$GITHUB_WORKSPACE/cmdline-tools"
          export ANDROID_SDK_ROOT="$GITHUB_WORKSPACE/cmdline-tools"
          
          # 4. Run the compilation command directly
          ./gradlew assembleRelease

      - name: Extract Completed APK
        uses: actions/upload-artifact@v4
        with:
          name: Twitter-AdFree
          path: "**/*.apk"
          
